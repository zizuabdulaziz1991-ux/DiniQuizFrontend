services:
  - type: web
    name: diniquiz-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://diniquiz-backend-0ikk.onrender.com/api/v1
      - key: VITE_TIME_LIMIT_SECONDS
        value: "30"
      - key: VITE_FEEDBACK_DELAY_MS
        value: "1500"
      # Paylaşım linki ve önizleme görseli için sitenin adresi (kendi alan adın olursa burayı değiştir)
      - key: VITE_SITE_URL
        value: https://diniquiz-frontend-c7to.onrender.com
    routes:
      # Vue Router (history modu) için tüm yolları index.html'e yönlendir
      - type: rewrite
        source: /*
        destination: /index.html
